<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapdio Clone Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-md bg-white p-3">
            <div class="container">
                <a class="navbar-brand bg-warning fw-bolder px-3 rounded-pill" href="#"
                    style="font-family: Comic Sans MS;">Rapido</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse d-md-flex justify-content-center" id="navbarSupportedContent">
                    <ul class="navbar-nav me-0 mb-2 mb-md-0">
                        <li class="nav-item">
                            <a class="nav-link active me-3" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-3" href="#">About us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-3" href="#">Safety</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-3" href="#">Careers</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-3" href="#">Blog</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-3" href="#">Press</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link me-3" href="#">Contact Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link bg-dark text-white px-3" style="border-radius: 25px 25px 0px 25px;"
                                href="#">Download App</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div class="container-fluid p-5" style="background-color: aliceblue;">
        <div class="row">
            <div class="col-12 col-md-6 ms-md-5">
                <h1 class="fw-bolder">India’s #1</h1>
                <h1 class="fw-bolder">Ride-hailing App</h1>
                <p class="fs-3">Quick, Affordable rides at your doorstep</p>
                <form>
                    <div class="input-group input-group-lg mb-3">
                        <span class="input-group-text bg-white border border-end-0" id="basic-addon1"><i
                                class="fa-solid fa-location-dot"></i></span>
                        <input type="text" class="form-control border border-start-0"
                            placeholder="Enter Pickup Location" aria-label="Username" aria-describedby="basic-addon1">
                    </div>
                    <div class="input-group input-group-lg mb-3">
                        <span class="input-group-text bg-white border border-end-0" id="basic-addon1"><i
                                class="fa-solid fa-map-pin"></i></span>
                        <input type="text" class="form-control border border-start-0" placeholder="Enter Drop
                        Location"
                            aria-label="Username" aria-describedby="basic-addon1">
                    </div>
                    <div class="input-group input-group-lg mb-3">
                        <input type="submit" value="Book Ride" class="form-control bg-warning fw-bolder">
                    </div>
                </form>
            </div>
            <div class="<div class="col-12 col-md-6">>
                <img src="https://content-cus.rapido.bike/image/banner_image_new.png" class="w-100" />
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
